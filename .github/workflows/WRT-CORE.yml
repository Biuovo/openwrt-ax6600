#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

permissions:
  contents: write
  actions: write

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_PKG_INFO: 官方 Honk 源码与插件版本
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-24.04
    outputs:
      cache_prefix: ${{steps.initialize-cache.outputs.cache_prefix}}
      cache_key: ${{steps.initialize-cache.outputs.cache_key}}
      cache_started: ${{steps.initialize-cache.outputs.cache_started}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yqq update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang \
            cmake cpio curl device-tree-compiler dos2unix file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git jq \
            libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
            llvm ninja-build patch perl pkgconf python3 python3-cryptography \
            python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
            unzip wget xz-utils zlib1g-dev zstd
          sudo apt-get -yqq clean

          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          WRT_FIRMWARE_NAME="ER1"
          echo "WRT_FIRMWARE_NAME=$WRT_FIRMWARE_NAME" >> $GITHUB_ENV
          echo "WRT_PROFILE_DESC=太乙 ER1 单一有线固件，沿用原插件组合，新增 daeuniverse 官方 Honk" >> $GITHUB_ENV
          WRT_INFO="${WRT_SOURCE%%/*}"
          echo "WRT_INFO=$WRT_INFO" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-no" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

          echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages" >> feeds.conf.default

      - name: Fix QCA8081 Port Clocks
        if: env.WRT_CONFIG != 'IPQ60XX-ER1'
        run: |
          cd ./wrt/
          bash "$GITHUB_WORKSPACE/.github/scripts/prepare-qca8081-clock-fix.sh"

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      # Cache lifecycle adapted from VIKINGYFY/OpenWRT-CI (MIT, Copyright 2026 VIKINGYFY).
      - name: Initialize Cache Values
        id: initialize-cache
        if: env.WRT_TEST != 'true'
        run: |
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[\w]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          # Isolate toolchain and cache by source, kernel target and ER1 device config.
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_TARGET-$WRT_SUBTARGET-$WRT_CONFIG"
          WRT_CACHE_KEY="$WRT_CACHE_PREFIX-$(git -C ./wrt rev-parse HEAD)"
          WRT_CACHE_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_KEY=$WRT_CACHE_KEY"
          } >> "$GITHUB_ENV"
          {
            echo "cache_prefix=$WRT_CACHE_PREFIX"
            echo "cache_key=$WRT_CACHE_KEY"
            echo "cache_started=$WRT_CACHE_STARTED"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Build Cache
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache/restore@v4
        with:
          # Cache only the ER1 build toolchain and host artifacts.
          key: ${{env.WRT_CACHE_KEY}}
          # 迁移时仅回退到同一源码提交的旧键，避免旧前缀混用其他分支。
          restore-keys: |
            ${{env.WRT_CACHE_PREFIX}}-
            ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: env.WRT_TEST != 'true' && steps.check-cache.outputs.cache-matched-key != ''
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skipped done!"
          else
            echo "caches missed!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          bash "$GITHUB_WORKSPACE/Scripts/Feeds.sh"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 额外强制安装缺失的 python 依赖
          ./scripts/feeds install -f python3-pysocks python3-unidecode


      - name: Custom Packages
        run: |
          cd ./wrt/package/

          : > "$GITHUB_WORKSPACE/package-versions.txt"
          bash "$GITHUB_WORKSPACE/Scripts/Prepare-ER1.sh"
          $GITHUB_WORKSPACE/Scripts/Packages.sh
          if [ -s "$GITHUB_WORKSPACE/package-versions.txt" ]; then
            {
              echo 'WRT_PKG_INFO<<EOF'
              cat "$GITHUB_WORKSPACE/package-versions.txt"
              echo 'EOF'
            } >> "$GITHUB_ENV"
          fi
          #$GITHUB_WORKSPACE/Scripts/Handles.sh

          cd $GITHUB_WORKSPACE/wrt/
          $GITHUB_WORKSPACE/.github/scripts/prepare-i2c-tools.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            #cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
            cat "$GITHUB_WORKSPACE/Config/GENERAL_ER1.txt" "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" > .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh

          cp .config .config.seed

          make defconfig -j$(nproc)
          make clean -j$(nproc)

          echo "=== 正在执行 .config 配置断言校验 ==="
          FAIL=0

          # 1. 检查 SONiC FullCone 是否入选
          if ! grep -q "^CONFIG_PACKAGE_fullconenat-sonic=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_fullconenat-sonic 未入选！"
            FAIL=1
          fi

          # 2. 检查旧版 NSS 模块是否有残留
          if grep -q "^CONFIG_PACKAGE_kmod-qca-nss-" .config; then
            echo "::error::断言失败: 发现旧版 NSS 模块残留！"
            grep "^CONFIG_PACKAGE_kmod-qca-nss-" .config
            FAIL=1
          fi

          # 3. 检查旧版 FullCone 是否有残留冲突
          if grep -q "^CONFIG_PACKAGE_kmod-nft-fullcone=y" .config; then
            echo "::error::断言失败: 发现旧版 kmod-nft-fullcone 残留冲突！"
            FAIL=1
          fi

          # 4. 检查 PPE 硬件流表与 LuCI 防火墙核心 (包含 firewall4 与目标机型)
          if ! grep -q "^CONFIG_PACKAGE_kmod-nft-offload=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_kmod-nft-offload 未入选！"
            FAIL=1
          fi
          if ! grep -q "^CONFIG_PACKAGE_luci-app-firewall=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_luci-app-firewall 未入选！"
            FAIL=1
          fi
          if ! grep -q "^CONFIG_PACKAGE_firewall4=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_firewall4 未入选！"
            FAIL=1
          fi
          if ! grep -q "^CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-07=y" .config; then
            echo "::error::断言失败: 目标设备 CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-07 未入选！"
            FAIL=1
          fi

          for PKG in honk luci-app-honk vmlinux-btf-builtin; do
            if ! grep -Fqx "CONFIG_PACKAGE_${PKG}=y" .config; then
              echo "::error::Required Honk package missing: $PKG"; FAIL=1
            fi
          done
          if grep -Eq '^CONFIG_PACKAGE_(kmod-ath11k[^=]*|kmod-nss-wifi-drv|wpad[^=]*|luci-app-athena-led)=[ym]$' .config; then
            echo "::error::ER1 must not include Wi-Fi or Athena LED packages"; FAIL=1
          fi
          if ! grep -Fqx 'CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config; then
            echo "::error::Honk requires built-in kernel BTF"; FAIL=1
          fi

          # Single image preserves the fork's full original PLUS package set.
          for PKG in luci-app-passwall2 luci-app-openclash luci-app-dockerman luci-app-adguardhome luci-app-wolultra; do
            if ! grep -q "^CONFIG_PACKAGE_${PKG}=y" .config; then
              echo "::error::ER1 package missing: ${PKG}"; FAIL=1
            fi
          done

          # 6. Qualcomm PPE 时钟驱动补丁生效断言
          PPE_DRIVER="target/linux/qualcommax/files/drivers/net/ethernet/qualcomm/qca_ppe_main.c"
          IPQ6018_PATCH="target/linux/qualcommax/patches-6.18/0918-clk-qcom-gcc-ipq6018-keep-port-5-on-uniphy1-at-SGMII-rates.patch"
          IPQ8074_CONFLICT="target/linux/qualcommax/patches-6.18/0919-clk-qcom-gcc-ipq8074-keep-port-5-on-uniphy1-at-SGMII-rates.patch"
          if [ -d "target" ]; then
            if [ ! -f "$PPE_DRIVER" ]; then
              echo "::error::断言失败: Qualcomm PPE 驱动文件缺失 ($PPE_DRIVER)！"
              FAIL=1
            elif ! grep -q "ppe_port_clk_parents" "$PPE_DRIVER"; then
              echo "::error::断言失败: Qualcomm PPE 驱动未成功植入 QCA8081 时钟修复逻辑！"
              FAIL=1
            elif [ ! -s "$IPQ6018_PATCH" ]; then
              echo "::error::断言失败: IPQ6018 GCC 时钟补丁缺失或为空 ($IPQ6018_PATCH)！"
              FAIL=1
            elif [ -e "$IPQ8074_CONFLICT" ]; then
              echo "::error::断言失败: 检测到已废弃的 IPQ8074 冲突补丁残留 ($IPQ8074_CONFLICT)！"
              FAIL=1
            else
              echo "  [PASS] Qualcomm PPE QCA8081 时钟修复逻辑与分频补丁校验通过。"
            fi
          fi

          rm -f .config.seed

          if [[ $FAIL -ne 0 ]]; then
            echo "::error::配置断言校验失败，终止构建！"
            exit 1
          fi
          echo "=== .config 配置断言校验全部通过 ==="

      - name: Install Honk stable Rust
        if: env.WRT_CONFIG == 'IPQ60XX-ER1' && env.WRT_TEST != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: aarch64-unknown-linux-musl

      - name: Install Honk eBPF tools
        if: env.WRT_CONFIG == 'IPQ60XX-ER1' && env.WRT_TEST != 'true'
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-10-20 --profile minimal --component rust-src --component llvm-tools
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$cargo_home/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bpf-linker.tar.zst" \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          echo "10f62ba9ab7e544d538370552660efcb4f1a19153d5752bbf0f6b51f3bada450  $RUNNER_TEMP/bpf-linker.tar.zst" | sha256sum -c -
          zstd -dc "$RUNNER_TEMP/bpf-linker.tar.zst" | tar -xf - -C "$cargo_home/bin"
          echo "$cargo_home/bin" >> "$GITHUB_PATH"
          echo 'CARGO_BUILD_JOBS=2' >> "$GITHUB_ENV"
          "$cargo_home/bin/bpf-linker" --version

      - name: Prepare Rust Toolchain
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          bash "$GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh"

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          mkdir -p $GITHUB_WORKSPACE/build-reports
          make -j$(nproc) BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" || \
            make -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv"

      - name: Collect Build Reports
        if: env.WRT_TEST != 'true' && always()
        continue-on-error: true
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh

      - name: Upload Build Reports
        if: env.WRT_TEST != 'true' && always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-er1-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./build-reports/
          retention-days: 7

      - name: Save Build Cache
        if: env.WRT_TEST != 'true' && success() && steps.check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-ER1-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt
          if [ -s "$GITHUB_WORKSPACE/package-versions.txt" ]; then
            cp -f "$GITHUB_WORKSPACE/package-versions.txt" ./upload/Packages-ER1-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt
          fi

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              # 去掉恒定的平台前缀（qualcommax-），保留 ipq60xx 及设备型号
              NAME=${NAME#*-}
              NEW_FILE="$WRT_INFO"-"$WRT_BRANCH"-er1-"$NAME"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            # 对最终命名后的固件生成校验文件，供用户刷机前验证下载完整性；失败不阻塞发布
            (cd ./upload/ && sha256sum *.bin > sha256sums.txt) || true

            make clean -j$(nproc)
          fi

      - name: Build Summary
        run: |
          {
            echo "## WRT Build Summary"
            echo ""
            echo "- Source: \`$WRT_SOURCE\`"
            echo "- Branch: \`$WRT_BRANCH\`"
            echo "- Config: \`$WRT_CONFIG\`"
            echo "- Firmware: ER1 single image"
            echo "- Target: \`$WRT_TARGET\`"
            echo "- Firmware mode: \`$WRT_WIFI\`"
            echo "- Build time: \`$WRT_DATE\`"
            echo "- Kernel: \`$WRT_KVER\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: er1-${{ env.WRT_INFO }}-${{ env.WRT_BRANCH }}-${{ env.WRT_DATE }}
          files: ./wrt/upload/*.*
          body: |
            📦 OpenWrt 太乙 ER1（JDCloud RE-CS-07）
            ━━━━━━━━━━━━━━━━━━━━━━━

            📌 基本信息
            <!-- 源码仓库：${{ env.WRT_REPO }} -->
            <!-- 编译分支：${{ env.WRT_BRANCH }} -->
            固件型号：太乙 ER1（RE-CS-07）
            固件版本：ER1 单一固件（原 PLUS 插件组合 + 官方 Honk）
            提交版本：${{ env.WRT_HASH }}
            编译时间：${{ env.WRT_DATE }}
            ━━━━━━━━━━━━━━━━━━━━━━━

            📌 外部插件来源
            ${{ env.WRT_PKG_INFO }}
            ━━━━━━━━━━━━━━━━━━━━━━━

            🧩 设备与平台
            设备型号：京东云太乙 ER1（RE-CS-07）
            硬件平台：${{ env.WRT_TARGET }}
            CPU架构：Qualcomm IPQ6018 / IPQ60xx
            ━━━━━━━━━━━━━━━━━━━━━━━

            ⚙️ 固件特性
            - Qualcomm PPE 开源硬件加速 + Linux 原生 Flowtable 硬件卸载
            - SONiC FullCone NAT1 游戏穿透支持
            - 基于 Linux 6.18 LTS 内核 / firewall4 架构
            - 常用 LuCI 插件预集成
            - 云端自动编译更新与极速构建优化
            - 支持自定义配置构建
            ━━━━━━━━━━━━━━━━━━━━━━━

            🔐 默认登录信息
            管理地址：${{ env.WRT_IP }}
            管理密码：${{ env.WRT_PW }}

            网络：纯有线，1 个千兆 WAN + 3 个千兆 LAN，无 Wi-Fi
            Honk：daeuniverse 官方核心与 LuCI，内置 Doona 面板
            ━━━━━━━━━━━━━━━━━━━━━━━
            📥 下载与刷机说明
            - 本 Release 是唯一 ER1 固件，包含原 PLUS 插件组合。
            - 首次从原厂固件刷入：选文件名带 factory 的文件
            - 已是 OpenWrt/ImmortalWrt 升级：选文件名带 sysupgrade 的文件
            - 请使用 ER1 对应的 U-Boot、分区表和升级方式；勿使用雅典娜设备的刷机附件。
            - Config-*.txt：本次编译的完整 .config 配置，便于复现或二次定制
            - Packages-*.txt：外部插件（OpenClash / PassWall2 等）的仓库、分支与 commit 记录（包含官方 Honk 源码版本）
            - sha256sums.txt：固件校验文件，刷机前请先校验下载完整性（方法见 README 刷机前必读）

            ⚠️ 风险提示
            刷机存在风险，请确认：
            - 已备份原厂固件
            - 能进入 U-Boot 或 TTL 恢复
            - 了解分区结构
            ━━━━━━━━━━━━━━━━━━━━━━━

            💡 插件信息
            内置组件：
            ${{ env.WRT_LIST }}

            内核版本：
            ${{ env.WRT_KVER }}

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: inputs.WRT_TEST != 'true' && needs.core.result == 'success'
    runs-on: ubuntu-24.04
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
      WRT_CACHE_STARTED: ${{needs.core.outputs.cache_started}}
    steps:
      - name: Roll Build Cache
        # 清理异常只警告，不把已发布固件标为构建失败。
        continue-on-error: true
        run: |
          set -euo pipefail
          CACHES=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key,createdAt)
          CURRENT_CREATED=$(jq -r --arg key "$WRT_CACHE_KEY" '[.[] | select(.key == $key) | .createdAt] | min // empty' <<< "$CACHES")
          if [ -z "$CURRENT_CREATED" ]; then
            echo "skip cache rollover: current cache is not available"
            exit 0
          fi

          # 只清理早于本次恢复、且早于当前缓存的条目。
          # 保护重叠构建新保存的缓存，也防止重跑旧提交删除较新的缓存。
          jq -r --arg key "$WRT_CACHE_KEY" --arg started "$WRT_CACHE_STARTED" --arg current "$CURRENT_CREATED" \
            '.[] | select(.key != $key and .createdAt < $started and .createdAt < $current) | .id' <<< "$CACHES" |
            while IFS= read -r CACHE_ID; do
              [ -n "$CACHE_ID" ] || continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "::warning::Failed to delete cache $CACHE_ID"
            done
